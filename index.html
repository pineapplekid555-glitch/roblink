/* ---------- formatting ---------- */

function msgHtml(m,prev,list){
  const s=curServer(),u=getUser(m.a)||{id:'?',name:'Deleted User',color:'#777'};
  if(m.sys)return`<div class="sysmsg" data-id="${m.id}">ℹ️ <span>${fmt(m.t)}</span></div>`;
  const re=m.re&&list.find(x=>x.id===m.re),ru=re&&getUser(re.a);
  const grp=prev&&!prev.sys&&prev.a===m.a&&!m.re&&m.ts-prev.ts<42e4&&new Date(prev.ts).getDate()===new Date(m.ts).getDate();
  const plus=u.id==='me'?S.me.plus:false,mine=m.a==='me';
  const canDel=mine||(s?perm(s,'me','MANAGE_MESSAGES'):false),canPin=s?perm(s,'me','MANAGE_MESSAGES'):true;
  const emojiOnly=m.t&&/^(\p{Extended_Pictographic}️?\s*){1,3}$/u.test(m.t);
  const body=V.edit===m.id?`<textarea class="input" id="editbox" rows="2" style="margin-top:4px">${esc(m.t)}</textarea><div class="sub" style="font-size:12px;margin-top:4px">Enter to <a href="#" data-act="saveEdit">save</a> • Esc to <a href="#" data-act="cancelEdit">cancel</a></div>`:`<div class="tx ${emojiOnly?'big-emoji':''}">${fmt(m.t||'',plus)}${m.ed?' <span class="edited">(edited)</span>':''}</div>`;
  let ex='';
  if(m.img)ex+=`<img class="att" src="${m.img}" alt="attachment" data-act="zoom">`;
  if(m.poll){const tot=m.poll.options.reduce((a,o)=>a+o.v.length,0);ex+=`<div class="embed poll"><h4>📊 ${esc(m.poll.q)}</h4>${m.poll.options.map((o,i)=>`<div class="opt ${o.v.includes('me')?'mine':''}" data-act="vote" data-a="${m.id}" data-b="${i}"><i style="width:${tot?Math.round(o.v.length/tot*100):0}%"></i><span>${esc(o.t)}</span><span>${o.v.length}</span></div>`).join('')}<div class="sub">${tot} vote${tot===1?'':'s'}</div></div>`}
  if(m.embed)ex+=`<div class="embed"><h4>${esc(m.embed.title)}</h4><div>${fmt(m.embed.desc)}</div>${m.embed.bar?'<div class="bar"><i></i></div>':''}</div>`;
  const rx=Object.entries(m.rx||{}).filter(([k,v])=>v.length);
  const rxh=rx.length?`<div class="rxs">${rx.map(([k,v])=>`<button class="rx ${v.includes('me')?'mine':''}" data-act="react" data-a="${m.id}" data-b="${esc(k)}">${emoHtml(k)}<span>${v.length}</span></button>`).join('')}<button class="rx" data-act="reactPick" data-a="${m.id}">＋</button></div>`:'';
  const acts=`<div class="acts"><button class="ib" data-act="reactPick" data-a="${m.id}" title="Add reaction">😀</button>${tier()>=2?`<button class="ib" data-act="superReact" data-a="${m.id}" title="Super reaction (Plus)">💥</button>`:''}<button class="ib" data-act="reply" data-a="${m.id}" title="Reply">↩️</button>${mine?`<button class="ib" data-act="edit" data-a="${m.id}" title="Edit">✏️</button>`:''}${canPin?`<button class="ib" data-act="pin" data-a="${m.id}" title="${m.pin?'Unpin':'Pin'}">📌</button>`:''}${canDel?`<button class="ib" data-act="del" data-a="${m.id}" title="Delete">🗑️</button>`:''}</div>`;
  const cls=`msg ${grp?'':'first'} ${mentionsMe(m)&&!mine?'mine-mention':''}`;
  const reply=re?`<div class="replyp" data-act="jumpMsg" data-a="${re.id}">${av(ru,16)}<b>${esc(ru?dispName(ru,s):'?')}</b><span>${esc((re.t||'📎 attachment').slice(0,80))}</span></div>`:m.re?`<div class="replyp"><i>Original message was deleted</i></div>`:'';
  if(grp)return`<div class="${cls}" data-id="${m.id}" data-ctx="msg"><span class="gts">${fmtTime(m.ts,1)}</span>${body}${ex}${rxh}${acts}</div>`;
  return`<div class="${cls}" data-id="${m.id}" data-ctx="msg">${reply}<div class="mav" data-act="profile" data-a="${u.id}">${av(u,40)}</div><div class="mh">${nameHtml(u,s)} ${badges(u)}<span class="ts">${fmtTime(m.ts)}</span>${m.pin?'<span class="pinbadge">📌</span>':''}</div>${body}${ex}${rxh}${acts}</div>`}

function secAppearance(){const s=S.set,p=tier();return`<h2>Appearance</h2><h3>Theme</h3><div class="themes">${THEMES.map(t=>`<div class="th ${s.theme===t[0]?'on':''}" data-act="setTheme" data-a="${t[0]}"><i style="background:${t[2]}"></i>${t[1]}${t[3]>p?`<span class="lk">🔒${t[3]>2?' MAX':''}</span>`:''}</div>`).join('')}</div>

function secOverview(s){const can=perm(s,'me','MANAGE_SERVER'),d=!can;return`<h2>Server Overview</h2>${can?'':lock(s,'MANAGE_SERVER')}<div style="display:flex;gap:16px;align-items:center"><div class="srv" style="width:80px;height:80px;font-size:34px;background:${s.color}">${s.iconImg?`<img src="${s.iconImg}">`:esc(s.icon)}</div><div><label class="btn primary ${d?'':''}">Upload icon<input type="file" id="sIcon" accept="image/*" hidden ${d?'disabled':''}></label> <button class="btn" data-act="rmSrvIcon" ${d?'disabled':''}>Remove</button><p class="sub">GIF icons need Boost Level 1.</p></div></div>
  ${fld('Server name','srv.name',s.name,{max:40,dis:d})}${fld('Icon text / emoji','srv.icon',s.icon,{max:2,dis:d})}${fld('Description','srv.desc',s.desc,{area:1,max:150,dis:d})}<label class="lbl">Icon colour</label>${swatches('srv.color',s.color,d)}
  ${tog('srv.isPublic','Show in Explore','Let anyone discover and join this server.',s.isPublic,d)}<h3>Banner (Boost Level 2)</h3>${boostLevel(s)>=2?`<input type="color" data-bind="srv.bannerColor" value="${s.bannerColor}" ${d?'disabled':''}> <label class="btn">Upload banner<input type="file" id="sBanner" accept="image/*" hidden ${d?'disabled':''}></label> <button class="btn" data-act="rmSrvBanner">Remove</button>`:`<p class="sub">🔒 This server needs ${7-s.boosts} more boost${7-s.boosts===1?'':'s'} to unlock banners.</p>`}`}
function secRoles(s){const can=perm(s,'me','MANAGE_ROLES');const sel=V.set.role||(s.roles[0]&&s.roles[0].id)||'everyone';const idx=s.roles.findIndex(r=>r.id===sel),isEv=sel==='everyone'||idx<0,r=isEv?null:s.roles[idx];const editable=can&&(isEv||idx>rank(s,'me'));
  const po=isEv?s.everyone:r.perms,base=isEv?'srv.everyone':`srv.roles.${idx}.perms`;const owner=s.owner==='me';
  return`<h2>Roles</h2>${can?'<p class="sub">Roles are ordered by power: roles higher in the list outrank those below. Members get the permissions of all their roles.</p>':lock(s,'MANAGE_ROLES')}<div class="rl"><div class="lst">${can?'<button class="btn primary sm" style="width:100%;margin-bottom:8px" data-act="roleNew">＋ Create Role</button>':''}${s.roles.map(x=>`<div class="ri ${x.id===sel?'on':''}" data-act="roleSel" data-a="${x.id}"><i style="background:${x.color}"></i>${esc(x.name)}</div>`).join('')}<div class="ri ${isEv?'on':''}" data-act="roleSel" data-a="everyone"><i style="background:#80848e"></i>@everyone</div></div><div class="ed">
  ${isEv?'<h3 style="margin-top:0">@everyone</h3><p class="sub">Default permissions for every member.</p>':`<h3 style="margin-top:0">Edit role</h3>${fld('Role name',`srv.roles.${idx}.name`,r.name,{max:30,dis:!editable})}<label class="lbl">Role colour</label><div style="display:flex;gap:10px;align-items:center"><input type="color" data-bind="srv.roles.${idx}.color" value="${r.color}" ${editable?'':'disabled'} style="width:48px;height:32px;border:0;background:none">${COLORS.map(c=>`<div class="sw ${c===r.color?'on':''}" style="background:${c};width:24px;height:24px" data-act="${editable?'setColor':'noop'}" data-a="srv.roles.${idx}.color" data-b="${c}"></div>`).join('')}</div>${tog(`srv.roles.${idx}.hoist`,'Display separately in member list','',r.hoist,!editable)}<div style="margin:10px 0"><button class="btn sm" data-act="roleUp" data-a="${idx}" ${editable&&idx>rank(s,'me')+1?'':'disabled'}>▲ Move up</button> <button class="btn sm" data-act="roleDown" data-a="${idx}" ${editable&&idx<s.roles.length-1?'':'disabled'}>▼ Move down</button> <button class="btn sm danger" data-act="roleDel" data-a="${idx}" ${editable?'':'disabled'}>Delete</button></div>`}
  <h3>Permissions</h3>${Object.entries(PERMS).map(([k,[n,d]])=>tog(`${base}.${k}`,n,d,po[k],!editable||(!owner&&!perm(s,'me',k)))).join('')}</div></div>`}

function secBoost(s){const lvl=boostLevel(s),nxt=[2,7,14][lvl],pct=lvl>=3?100:Math.round(s.boosts/nxt*100),mine=(S.me.boosted||{})[s.id]||0;

function secSafety(s){const d=!perm(s,'me','MANAGE_SERVER');return`<h2>Safety Setup</h2>${d?lock(s,'MANAGE_SERVER'):''}${selb('Verification level','srv.verification',s.verification,[['none','None'],['low','Low – verified email'],['medium','Medium – registered 5+ minutes'],['high','High – member 10+ minutes']],d)}${selb('Explicit media filter','srv.filter',s.filter,[['off','Don\'t scan'],['members','Scan members without roles'],['all','Scan all members']],d)}<h3>AutoMod</h3>${tog('srv.automod.on','Enable word filter','Requires <b>ModBot</b> to be in the server. Matching messages are deleted automatically.',s.automod.on,d)}<label class="lbl">Blocked words (comma separated)</label><textarea class="input" rows="2" data-fn="words" ${d?'disabled':''}>${esc(s.automod.words.join(', '))}</textarea>${s.bots.includes('modbot')?'':'<p class="sub" style="color:var(--yellow)">⚠️ ModBot isn\'t installed. Add it under Bots &amp; Integrations.</p>'}`}
function secChannels(s){const can=perm(s,'me','MANAGE_CHANNELS');return`<h2>Channels</h2>${can?'':lock(s,'MANAGE_CHANNELS')}${can?'<button class="btn primary sm" data-act="newCh">＋ Create channel</button> <button class="btn sm" data-act="newCat">＋ Create category</button>':''}<table class="tbl" style="margin-top:12px"><tr><th>Name</th><th>Type</th><th>Category</th><th></th></tr>${s.channels.map((c,i)=>`<tr><td>${c.type==='voice'?'🔊':'#'} ${esc(c.name)}</td><td>${c.type}</td><td>${esc((s.categories.find(k=>k.id===c.cat)||{}).name||'—')}</td><td>${can?`<button class="ib" data-act="chUp" data-a="${i}">▲</button><button class="ib" data-act="chDown" data-a="${i}">▼</button><button class="ib" data-act="editCh" data-a="${c.id}">✏️</button>`:''}</td></tr>`).join('')}</table>`}
A.newCat=()=>newCatModal(srvOf());
function secMembers(s){const q=(V.set.q||'').toLowerCase();const ids=Object.keys(s.members).filter(i=>getUser(i)&&(!q||getUser(i).name.toLowerCase().includes(q)));const canR=perm(s,'me','MANAGE_ROLES');

A.mTimeout=el=>timeoutModal(srvOf(),el.dataset.a);A.mKick=el=>modAct('kick',srvOf(),el.dataset.a);A.mBan=el=>modAct('ban',srvOf(),el.dataset.a);
function secBots(s){const can=perm(s,'me','MANAGE_SERVER');return`<h2>Bots &amp; Integrations</h2>${can?'':lock(s,'MANAGE_SERVER')}<p class="sub">Bots respond to slash commands in this server. Try <code>/help</code> in chat.</p>${Object.entries(BOTS).map(([id,b])=>{const on=s.bots.includes(id);return`<div class="card" style="display:flex;gap:12px;align-items:center">${av(S.users[id],44)}<div style="flex:1"><b style="color:var(--text)">${b.name}</b> <span class="badge">BOT</span><div class="sub">${b.desc}</div><div class="sub" style="font-size:12px">${Object.keys(b.cmds).map(c=>'/'+c).join('  ')}</div></div>${can?`<button class="btn sm ${on?'danger':'green'}" data-act="botToggle" data-a="${id}">${on?'Remove':'Add to server'}</button>`:`<span class="sub">${on?'Installed':''}</span>`}</div>`}).join('')}`}
function secInvites(s){const can=perm(s,'me','INVITE');return`<h2>Invites</h2>${can?'':lock(s,'INVITE')}${(()=>{const ok=s.boosts>=14,cm=perm(s,'me','MANAGE_SERVER');return`<div class="card"><div class="sub">Custom invite code ${ok?'':'🔒 Boost Level 3 (14 boosts)'}</div><div style="display:flex;gap:8px;margin-top:6px"><input class="input" id="vanity" maxlength="20" placeholder="my-server" ${ok&&cm?'':'disabled'}><button class="btn primary" data-act="setVanity" ${ok&&cm?'':'disabled'}>Set</button></div></div>`})()}<div class="card"><div class="sub">Main invite code</div><div style="display:flex;gap:8px;margin-top:6px"><input class="input" readonly value="${s.invite}"><button class="btn primary" data-act="copy" data-a="${s.invite}">Copy</button></div></div>${can?'<button class="btn primary sm" data-act="newInvite">＋ Create invite</button> <button class="btn sm" data-act="invPeople">Invite friends</button>':''}<table class="tbl" style="margin-top:12px"><tr><th>Code</th><th>Inviter</th><th>Uses</th><th></th></tr>${s.invites.map((v,i)=>`<tr><td><code>${v.code}</code></td><td>${esc(getUser(v.by)?getUser(v.by).name:'?')}</td><td>${v.uses}${v.max?' / '+v.max:''}</td><td>${can?`<button class="btn sm danger" data-act="invDel" data-a="${i}">Revoke</button>`:''}</td></tr>`).join('')||'<tr><td colspan=4 class="sub">No custom invites yet.</td></tr>'}</table>`}
function secBans(s){const can=perm(s,'me','BAN');return`<h2>Bans</h2>${can?'':lock(s,'BAN')}<table class="tbl"><tr><th>User</th><th>Reason</th><th>Date</th><th></th></tr>${s.bans.map((b,i)=>`<tr><td>${esc(getUser(b.id)?getUser(b.id).name:b.id)}</td><td>${esc(b.reason||'—')}</td><td>${new Date(b.ts).toLocaleDateString()}</td><td>${can?`<button class="btn sm" data-act="unban" data-a="${i}">Unban</button>`:''}</td></tr>`).join('')||'<tr><td colspan=4 class="sub">No one is banned. 🎉</td></tr>'}</table>`}
function secAudit(s){return`<h2>Audit Log</h2>${s.audit.length?s.audit.map(a=>`<div class="row"><span><b style="color:var(--text)">${esc(a.who)}</b> ${esc(a.t)}</span><span class="sub">${fmtTime(a.ts)}</span></div>`).join(''):'<p class="sub">Nothing here yet.</p>'}`}
function secDelete(s){if(s.owner!=='me')return`<h2>Leave Server</h2><p class="sub">You are not the owner of this server.</p><button class="btn danger" data-act="leaveFromSet">Leave ${esc(s.name)}</button>`;return`<h2>Delete Server</h2><div class="card" style="border-left:4px solid var(--red)">Deleting <b>${esc(s.name)}</b> is permanent and removes all channels and messages.</div><label class="lbl">Type the server name to confirm</label><input class="input" id="delc" placeholder="${esc(s.name)}"><br><br><button class="btn danger" data-act="delServer">Delete Server</button>`}
A.leaveFromSet=()=>{const s=srvOf();A.closeSet();leaveServer(s)};

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const pk=$('.picker');if(pk&&!e.target.closest('.picker')&&!e.target.closest('[data-act=emojiPick],[data-act=reactPick]'))pk.remove();
  if(!e.target.closest('.ctx'))closeCtx();
  const sg=e.target.closest('#suggest [data-cmd]');if(sg){const i=$('#input');i.value=sg.dataset.cmd+' ';i.focus();$('#suggest').style.display='none';return}
  const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el,e)}});
document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-ctx]');if(!el||!MYID)return;e.preventDefault();ctxFor(el,e.clientX,e.clientY)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.bind){let path=t.dataset.bind,val=t.type==='checkbox'?t.checked:(t.type==='range'||t.type==='number')?Number(t.value):t.value;
    if(t.dataset.plus&&tier()<2){if(t.type==='checkbox')t.checked=false;else if(t.type==='color'){t.value=S.set.accent}toast('That\'s a Roblink Plus perk 💎','err');return}
    if(path==='me.username')val=val.toLowerCase().replace(/[^a-z0-9_.]/g,'');if((path==='me.name'||path==='srv.name'||path.endsWith('.name'))&&!val.trim()&&t.type==='text')return;
    setPath(path,val);persistBind(path,val);save();applyTheme();refreshApp();
    if(t.type==='checkbox'||t.tagName==='SELECT')renderSet();else{updatePreview();if(t.type==='range'){const l=t.previousElementSibling;if(l&&l.classList.contains('lbl'))l.textContent=l.textContent.replace(/:.*$/,': '+val+(path==='set.font'?'px':'%'))}}}
  else if(t.dataset.fn==='words'){const s=srvOf();s.automod.words=t.value.split(',').map(x=>x.trim()).filter(Boolean);persistBind('srv.automod.words');save()}
  else if(t.dataset.fn==='memq'){V.set.q=t.value;const pos=t.selectionStart;renderSet();const n=$('#mq');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.id==='input'){autosize(t);sendTyping();V.drafts[convKey()]=t.value;const lim=S.me.plus?4000:2000;$('#cnt').textContent=t.value.length>lim*.85?`${t.value.length}/${lim}`:'';suggest(t.value)}});
document.addEventListener('keydown',e=>{
  if(!S||!MYID)return;const t=e.target;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();quickSwitch();return}
  if(e.key==='Escape'){if($('.picker')){$('.picker').remove();return}if($('.ctx')){closeCtx();return}if($('.lightbox')){$('.lightbox').remove();return}if($('#modal')){closeModal();return}if(V.edit){A.cancelEdit();return}if(V.set){A.closeSet();return}if(V.reply){A.cancelReply();return}}
  if(t.id==='editbox'){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();A.saveEdit()}return}
  if(t.id==='search'&&e.key==='Enter'){doSearch(t.value);t.value='';return}
  if(t.id==='input'){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();A.send();return}
    if(e.key==='Tab'&&$('#suggest')&&$('#suggest').style.display!=='none'){e.preventDefault();const f=$('#suggest [data-cmd]');if(f){t.value=f.dataset.cmd+' ';$('#suggest').style.display='none'}return}
    if(e.key==='ArrowUp'&&!t.value){const l=(S.messages[convKey()]||[]).filter(m=>m.a==='me'&&!m.sys);const m=l[l.length-1];if(m){e.preventDefault();V.edit=m.id;renderMsgs()}}}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){const s=curServer();if(!s)return;const l=s.channels.filter(c=>c.type==='text'),i=l.findIndex(c=>c.id===V.channel),n=l[(i+(e.key==='ArrowDown'?1:-1)+l.length)%l.length];if(n){e.preventDefault();go(s.id,n.id)}}});
function suggest(v){const box=$('#suggest');if(!box)return;if(v[0]!=='/'||v.includes(' ')){box.style.display='none';return}const s=curServer(),d=curDm();
  const list=[['/help','Show available commands'],['/me','Action message'],['/shrug','¯\\_(ツ)_/¯'],['/spoiler','Hide text'],['/nick','Set your nickname']];

function precheck(text,att){const s=curServer(),lim=S.me.plus?4000:2000;text=text.trim();
  if(text.length>lim)return `Message too long (max ${lim}). ${S.me.plus?'':'Roblink Plus raises it to 4,000.'}`;
  if(s){if(!perm(s,'me','SEND'))return 'You do not have permission to send messages in this channel.';if(s.members.me&&s.members.me.timeout>now())return 'You are timed out and cannot send messages.';if(att&&!perm(s,'me','ATTACH'))return 'You cannot attach files here.'}

async function insertRow(key,fields){const row={author_id:MYID,...fields};row[isDmKey(key)?'dm_id':'channel_id']=key;return must(sb.from('messages').insert(row).select().single())}
async function sendMsg(text,att,re,key){
  const s=curServer(),isCmd=text[0]==='/'&&/^\/[a-z0-9]+/i.test(text);

function sysLocal(key,t){pushMsg(key,{id:'local-'+uid(),a:'sys',by:'sys',t,ts:now(),sys:1,rx:{},local:1});if(convKey()===key)renderMsgs(true)}
async function builtin(text,key,s){
  const[c,...r]=text.slice(1).split(' '),cmd=c.toLowerCase(),arg=r.join(' ').trim();
  const say=async t=>{try{const row=await insertRow(key,{content:t});onNewMessage(key,mapMsg(row))}catch(e){toast(errMsg(e),'err')}};
  if(cmd==='help'){const inst=s?s.bots:[];let t='**Built-in:** `/help` `/me` `/shrug` `/nick` `/spoiler`\n';inst.forEach(b=>{if(BOTS[b])t+=`**${BOTS[b].name}:** `+Object.values(BOTS[b].cmds).map(x=>'`'+x.split(' –')[0]+'`').join(' ')+'\n'});sysLocal(key,t+'*(only you can see this)*');return true}
  if(cmd==='me'){await say('*'+(arg||'waves')+'*');return true}
  if(cmd==='shrug'){await say((arg?arg+' ':'')+'¯\\_(ツ)_/¯');return true}
  if(cmd==='spoiler'){await say('||'+arg+'||');return true}
  if(cmd==='nick'){if(!s){sysLocal(key,'`/nick` only works inside a server.');return true}await tryDo(async()=>{await must(sb.from('server_members').update({nickname:arg.slice(0,32)}).eq('server_id',s.id).eq('user_id',MYID));s.members.me.nick=arg.slice(0,32);refreshApp()},arg?`Nickname set to ${arg}.`:'Nickname cleared.');return true}
  return false}
const QUEUE=[];
function botSay(key,botId,payload,delay){
  const u=S.users[botId],l=V.typing[key]=V.typing[key]||[];l.push(u.name);renderTyping();
  setTimeout(async()=>{const i=l.indexOf(u.name);if(i>=0)l.splice(i,1);renderTyping();
    try{const p=typeof payload==='string'?{content:payload}:{content:payload.t||'',poll:payload.poll||null,embed:payload.embed||null};const row=await insertRow(key,{kind:'bot',bot_id:botId,...p});onNewMessage(key,mapMsg(row))}catch(e){toast(errMsg(e),'err')}},delay||700)}
function botCmd(text,key,s){
  const[c,...r]=text.slice(1).split(' '),cmd=c.toLowerCase(),arg=r.join(' ').trim();
  const bots=s?s.bots:[];const b=bots.find(id=>BOTS[id]&&BOTS[id].cmds[cmd]);
  if(!b){setTimeout(()=>sysLocal(key,`No bot here handles \`/${esc(cmd)}\`. ${s?'Add one in Server Settings → Bots, or ':''}type \`/help\`.`),200);return}
  const say=(p,d)=>botSay(key,b,p,d);
  switch(cmd){
    case'roll':{const m=/^(\d*)d(\d+)$/i.exec(arg||'1d6');if(!m)return say('Use the format `/roll 2d20`.');const n=Math.min(+m[1]||1,20),f=Math.max(2,Math.min(+m[2],1000)),rs=Array.from({length:n},()=>rnd(1,f));return say(`🎲 **${esc(S.me.name)}** rolled **${n}d${f}**: [${rs.join(', ')}] = **${rs.reduce((a,b)=>a+b,0)}**`)}
    case'coinflip':return say(`🪙 It's **${Math.random()<.5?'Heads':'Tails'}**!`);
    case'8ball':if(!arg)return say('Ask me a question! `/8ball will I win?`');return say(`🎱 *${esc(arg)}*\n**${pick(['It is certain.','Without a doubt.','Yes – definitely.','Most likely.','Reply hazy, try again.','Ask again later.','Don\'t count on it.','My sources say no.','Very doubtful.','Outlook good.'])}**`);
    case'joke':return say(pick(['Why did the obby player cross the road? To get to the next checkpoint.','I would tell you a Lua joke, but it\'s 1-indexed and I\'d be off by one.','Why do builders make bad secret agents? They always leave blocks behind.','There are 10 kinds of people: those who understand binary and those who don\'t.']));
    case'fact':return say('💡 '+pick(['Honey never spoils – edible honey was found in ancient tombs.','Octopuses have three hearts.','A day on Venus is longer than its year.','Bananas are berries, but strawberries are not.','The first computer bug was a real moth.']));
    case'poll':{const p=arg.split('|').map(x=>x.trim()).filter(Boolean);if(p.length<3||p.length>6)return say('Usage: `/poll Question | Option A | Option B` (2–5 options)');return say({poll:{q:p[0],options:p.slice(1)},t:''},500)}
    case'purge':{const n=Math.min(parseInt(arg)||0,50);if(!s||!perm(s,'me','MANAGE_MESSAGES'))return say('⛔ You need the **Manage Messages** permission.');if(n<1)return say('Usage: `/purge 10`');
      (async()=>{try{const rows=await must(sb.from('messages').select('id').eq('channel_id',key).order('created_at',{ascending:false}).limit(n+1));const ids=rows.map(x=>x.id);await must(sb.from('messages').delete().in('id',ids).select('id'));const l=S.messages[key];if(l)S.messages[key]=l.filter(m=>!ids.includes(m.id));renderMsgs();say(`🧹 Deleted **${n}** messages.`,300)}catch(e){toast(errMsg(e),'err')}})();return}
    case'warn':{if(!s||!(perm(s,'me','KICK')||perm(s,'me','TIMEOUT')))return say('⛔ You need a moderation permission.');if(!arg)return say('Usage: `/warn @user reason`');return say(`⚠️ ${fmt(arg.split(' ')[0])} has been warned. ${esc(arg.split(' ').slice(1).join(' ')||'')}`)}
    case'play':if(!arg)return say('Tell me what to play: `/play lofi beats`');QUEUE.push(arg);return say({t:'',embed:{title:'🎵 Now playing',desc:'**'+esc(arg)+'**\nRequested by '+esc(S.me.name),bar:1}},600);
    case'queue':return say({t:'',embed:{title:'📜 Queue',desc:QUEUE.length?QUEUE.map((q,i)=>`${i+1}. ${esc(q)}`).join('\n'):'The queue is empty.'}});
    case'skip':QUEUE.shift();return say('⏭️ Skipped!')}}

async function swapPos(table,a,b,sid){const pa=a.position!==undefined?a.position:null;await tryDo(async()=>{const items=table==='channels'?S.servers.find(x=>x.id===sid).channels:null;
  const ia=items.indexOf(a),ib=items.indexOf(b);const posA=ia,posB=ib;await Promise.all([must(sb.from(table).update({position:posB}).eq('id',a.id)),must(sb.from(table).update({position:posA}).eq('id',b.id))]);await reloadServer(sid)})}

document.addEventListener('change',e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
  const up=async(max,kind,apply,png)=>readImage(f,max,async(blob,gif)=>{await tryDo(async()=>{const url=await uploadBlob(blob,kind);await apply(url,gif)})},png);
  if(t.id==='file'){readImage(f,1600,(blob,gif,url)=>{V.att={blob,url};renderAtt()})}
  else if(t.id==='avFile'){if(f.type==='image/gif'&&tier()<2){toast('Animated avatars require Roblink Plus 💎','err')}else up(256,'avatar',async url=>{await must(sb.from('profiles').update({avatar_url:url}).eq('id',MYID));S.me.avatarImg=url;updatePreview();refreshApp();renderSet()})}
  else if(t.id==='bnFile'){if(tier()<2)toast('Banner images require Roblink Plus 💎','err');else up(1000,'banner',async url=>{await must(sb.from('profiles').update({banner_url:url}).eq('id',MYID));S.me.bannerImg=url;updatePreview();renderSet()})}
  else if(t.id==='sIcon'){const s=srvOf();if(f.type==='image/gif'&&boostLevel(s)<1)toast('Animated icons need Boost Level 1.','err');else up(256,'icon',async url=>{await must(sb.from('servers').update({icon_url:url}).eq('id',s.id));s.iconImg=url;renderRail();renderSet()})}
  else if(t.id==='sBanner'){const s=srvOf();up(1000,'banner',async url=>{await must(sb.from('servers').update({banner_url:url}).eq('id',s.id));s.bannerImg=url;renderSide();renderSet()})}
  else if(t.id==='emFile'){const s=srvOf(),lim=50+boostLevel(s)*50;if(s.emojis.length>=lim)toast('No emoji slots left – boost the server for more!','err');else{let n=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9_]/g,'_').slice(0,20);if(n.length<2)n='emoji'+rnd(10,99);while(s.emojis.some(x=>x.name===n))n=n.slice(0,17)+rnd(100,999);up(64,'emoji',async url=>{await must(sb.from('emojis').insert({server_id:s.id,name:n,url}));await reloadServer(s.id)},true)}}
  t.value=''});

/* ---------- boot ---------- */
async function boot(){
  if(typeof supabase==='undefined'){authShell('<h1>Can\'t load Roblink</h1><p class="sub">The Supabase library failed to load. Check your connection or ad-blocker and refresh.</p>');return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){if(APP_STARTED)pwModal();else RECOVERY=true}if(ev==='SIGNED_OUT'&&MYID)location.reload()});
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(session)startSession(session.user);else showAuth('signup')}
boot();

function plansHtml(){
  const t=tier(),m=S.me;
  const head=t?`<div class="hero"><h1>💎 Roblink ${PLANS[t].name}</h1><p>Member since ${new Date(m.plusSince||now()).toLocaleDateString()}. Boosts left: <b>${m.boostsLeft}</b></p></div>`:`<div class="hero"><h1>💎 Unlock the full Roblink</h1><p>Pick a plan for themes, bigger uploads, animated profiles and free server boosts.</p></div>`;
  const note=demoOn()?'<p class="sub">Demo mode: plans activate instantly and <b>no payment is taken</b> (prices are placeholders).</p>':'<p class="sub" style="color:var(--yellow)">Purchases are not open yet. Roblink staff can still grant plans.</p>';
  const cards=[1,2,3].map(i=>{const p=PLANS[i];return`<div class="tier ${t===i?'cur':''} ${i===2?'best':''}"><h3>${p.name}${i===2?' ⭐':''}</h3><div class="pr">${p.price}</div><ul>${p.perks.map(x=>`<li>${x}</li>`).join('')}</ul>${t===i?'<button class="btn" disabled>Current plan</button>':`<button class="btn primary" data-act="getPlus" data-a="${i}" ${demoOn()?'':'disabled'}>${t>i?'Downgrade':t?'Upgrade':'Get'} ${p.name}</button>`}</div>`}).join('');
  const shop=`<h3>Boost packs</h3><p class="sub">Extra server boosts, one-off. They stay yours even if you cancel your plan. Server levels: 2 / 7 / 14 boosts.</p><div class="feat">${PACKS.map(([n,pr])=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:26px">🚀</div><b>${n} boost${n>1?'s':''}</b><div class="sub">${pr}</div><button class="btn sm primary" data-act="buyBoosts" data-a="${n}" ${demoOn()?'':'disabled'}>Buy</button></div>`).join('')}</div>`;
  return`<h2>Roblink Plans</h2>${head}${note}<div class="tiers">${cards}</div>${shop}${t?'<h3>Manage</h3><button class="btn danger" data-act="cancelPlan0">Cancel plan</button>':''}`}
A.cancelPlan0=()=>A.cancelPlus();
/* ============ Roblink Staff Panel ============ */
const STAFF_RANK={user:1,moderator:2,admin:3,owner:4};
const myStaffRank=()=>STAFF_RANK[S.me.platformRole]||1;
V.staff={tab:'overview',q:'',d:{},busy:{}};
const uname=id=>(getUser(mid(id))||{name:String(id||'?').slice(0,8)}).name;
async function staffLoad(tab){
  const st=V.staff;if(st.busy[tab])return;st.busy[tab]=1;
  try{
    if(tab==='overview')st.d.overview=await rpc('staff_stats');
    else if(tab==='users'){let q=sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(40);const t=st.q.trim().toLowerCase().replace(/[%,()]/g,'');if(t)q=q.or(`username.ilike.%${t}%,display_name.ilike.%${t}%`);st.d.users=await must(q)}
    else if(tab==='servers'){const rows=await must(sb.from('servers').select('id,name,owner_id,boosts,is_public,created_at').order('created_at',{ascending:false}).limit(60));await ensureUsers(rows.map(r=>r.owner_id));st.d.servers=rows}
    else if(tab==='reports'){const rows=await must(sb.from('reports').select('*').order('status').order('created_at',{ascending:false}).limit(60));await ensureUsers(rows.flatMap(r=>[r.reporter_id,r.reported_user_id]));st.d.reports=rows}
    else if(tab==='log'){const rows=await must(sb.from('staff_log').select('*').order('created_at',{ascending:false}).limit(80));await ensureUsers(rows.map(r=>r.actor_id));st.d.log=rows}
  }catch(e){st.d[tab]={error:errMsg(e)}}
  st.busy[tab]=0;if(V.set&&V.set.sec==='staff'){const q=$('#stq'),pos=q&&q.selectionStart;renderSet();if(q){const n=$('#stq');if(n){n.focus();n.setSelectionRange(pos,pos)}}}}
function staffRefresh(tab){if(!isStaff())return;V.staff.d[tab]=null;if(V.set&&V.set.sec==='staff'&&V.staff.tab===tab)renderSet()}
function secStaff(){
  if(!isStaff())return'<h2>Staff Panel</h2><p class="sub">Staff only.</p>';
  const st=V.staff,tab=st.tab,d=st.d[tab];
  const tabs=[['overview','Overview'],['users','Users'],['servers','Servers'],['reports','Reports'],['log','Staff log']];
  let body='';if(!d){staffLoad(tab);body='<p class="sub">Loading…</p>'}else if(d.error)body=`<div class="card" style="border-left:4px solid var(--red)">${esc(d.error)}</div>`;else body=({overview:stOverview,users:stUsers,servers:stServers,reports:stReports,log:stLog}[tab])(d);
  return`<h2>🛡️ Staff Panel</h2><p class="sub">Signed in as <b>${esc(S.me.platformRole)}</b>. Every action here is recorded in the staff log.</p><div class="tabs2" style="margin:14px 0">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="stTab" data-a="${k}">${l}</button>`).join('')}<button data-act="stRefresh" title="Refresh">⟳</button></div>${body}`}
A.stTab=el=>{V.staff.tab=el.dataset.a;renderSet()};
A.stRefresh=()=>{V.staff.d[V.staff.tab]=null;renderSet()};
const stat=(l,v)=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:28px;font-weight:700;color:var(--text)">${v}</div><div class="sub">${l}</div></div>`;
const stOverview=d=>`${myStaffRank()===4?`<div class="card"><b style="color:var(--text)">Demo purchases:</b> ${demoOn()?'<span style="color:var(--green)">ON – anyone can activate plans/boosts for free</span>':'<span style="color:var(--red)">OFF – only staff can grant</span>'} <button class="btn sm" data-act="stDemo">${demoOn()?'Turn off':'Turn on'}</button></div>`:''}<div class="feat">${stat('Users',d.users)}${stat('Servers',d.servers)}${stat('Messages',d.messages)}${stat('Messages (24h)',d.messages_24h)}${stat('Open reports',d.open_reports)}${stat('Suspended',d.suspended)}</div>`;
function stUsers(rows){
  return`<input class="input" id="stq" data-fn="stq" placeholder="Search by username or display name" value="${esc(V.staff.q)}"><table class="tbl" style="margin-top:12px"><tr><th>User</th><th>Staff role</th><th>Joined</th><th></th></tr>${rows.map(p=>{
    const self=p.id===MYID,can=!self&&STAFF_RANK[p.platform_role]<myStaffRank();
    return`<tr><td><b style="color:var(--text)">${esc(p.display_name)}</b><div class="sub">@${esc(p.username)}${p.plus?` 💎 ${TIERN[p.plus_tier||2]}`:''} <span class="sub">🚀${p.boosts_left}</span></div></td><td>${esc(p.platform_role)}${p.suspended?' <span class="badge" style="background:var(--red)">SUSPENDED</span>':''}</td><td>${new Date(p.created_at).toLocaleDateString()}</td><td style="white-space:nowrap">${can?(p.suspended?`<button class="btn sm green" data-act="stUnsus" data-a="${p.id}">Unsuspend</button>`:`<button class="btn sm danger" data-act="stSus" data-a="${p.id}">Suspend</button>`):''}${myStaffRank()===4?` <button class="btn sm" data-act="stGrant" data-a="${p.id}" data-b="${p.plus_tier||0}">Grant…</button>`:''}${myStaffRank()===4&&!self?` <button class="btn sm" data-act="stRole" data-a="${p.id}" data-b="${p.platform_role}">Role…</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=4 class="sub">No users found.</td></tr>'}</table>`}
A.stSus=el=>{const id=el.dataset.a;modal({title:'Suspend user',sub:'They will be locked out of Roblink until unsuspended.',body:'<label class="lbl">Reason (shown to the user)</label><input class="input" id="sr" maxlength="200">',btns:[{label:'Cancel',cls:'ghost'},{label:'Suspend',cls:'danger',fn:()=>{tryDo(async()=>{await rpc('staff_set_suspended',{target:id,flag:true,why:$('#sr').value.trim()});V.staff.d.users=null;V.staff.d.log=null;renderSet()},'User suspended.')}}]})};
A.stUnsus=el=>tryDo(async()=>{await rpc('staff_set_suspended',{target:el.dataset.a,flag:false,why:''});V.staff.d.users=null;V.staff.d.log=null;renderSet()},'User unsuspended.');
A.stRole=el=>{const id=el.dataset.a;modal({title:'Set staff role',sub:'Only the platform owner can do this.',body:`<select class="input" id="srole">${['user','moderator','admin','owner'].map(r=>`<option ${r===el.dataset.b?'selected':''}>${r}</option>`).join('')}</select>`,btns:[{label:'Cancel',cls:'ghost'},{label:'Save',cls:'primary',fn:()=>{tryDo(async()=>{await rpc('staff_set_role',{target:id,new_role:$('#srole').value});V.staff.d.users=null;V.staff.d.log=null;renderSet()},'Role updated.')}}]})};
function stServers(rows){return`<table class="tbl"><tr><th>Server</th><th>Owner</th><th>Boosts</th><th>Created</th><th></th></tr>${rows.map(s=>`<tr><td><b style="color:var(--text)">${esc(s.name)}</b>${s.is_public?' <span class="sub">public</span>':''}</td><td>${esc(uname(s.owner_id))}</td><td>${s.boosts}</td><td>${new Date(s.created_at).toLocaleDateString()}</td><td>${myStaffRank()>=3?`<button class="btn sm danger" data-act="stDelSrv" data-a="${s.id}" data-b="${esc(s.name)}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="sub">No servers.</td></tr>'}</table>`}
A.stDelSrv=el=>{const id=el.dataset.a;confirmBox('Delete server',`Permanently delete <b>${esc(el.dataset.b)}</b> and everything in it? This cannot be undone.`,'Delete server',()=>{tryDo(async()=>{await rpc('staff_delete_server',{sid:id});if(S.servers.some(s=>s.id===id))dropServer(id);V.staff.d.servers=null;V.staff.d.log=null;renderSet()},'Server deleted.')},1)};
function stReports(rows){return rows.length?rows.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b style="color:var(--text)">${esc(uname(r.reported_user_id))}</b> reported by ${esc(uname(r.reporter_id))}</span><span class="sub">${fmtTime(+new Date(r.created_at))} • <b>${esc(r.status)}</b></span></div><div style="background:var(--bg1);border-radius:6px;padding:8px;margin:8px 0;white-space:pre-wrap;word-break:break-word">${esc(r.snapshot||'(no text)')}</div>${r.reason?`<div class="sub">Reason: ${esc(r.reason)}</div>`:''}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${r.status==='open'?`<button class="btn sm green" data-act="stRes" data-a="${r.id}" data-b="resolved">Resolve</button><button class="btn sm" data-act="stRes" data-a="${r.id}" data-b="dismissed">Dismiss</button>`:`<button class="btn sm" data-act="stRes" data-a="${r.id}" data-b="open">Reopen</button>`}${r.message_id?`<button class="btn sm danger" data-act="stDelMsg" data-a="${r.message_id}">Delete message</button>`:''}${r.reported_user_id&&r.reported_user_id!==MYID?`<button class="btn sm danger" data-act="stSus" data-a="${r.reported_user_id}">Suspend user</button>`:''}</div></div>`).join(''):'<div class="empty">No reports. 🎉</div>'}
A.stRes=el=>tryDo(async()=>{await rpc('staff_resolve_report',{rid:el.dataset.a,new_status:el.dataset.b});V.staff.d.reports=null;V.staff.d.log=null;renderSet()});
A.stDelMsg=el=>tryDo(async()=>{await rpc('staff_delete_message',{mid:el.dataset.a});Object.values(S.messages).forEach(l=>{if(!l)return;const i=l.findIndex(m=>m.id===el.dataset.a);if(i>=0)l.splice(i,1)});renderMsgs();V.staff.d.log=null;toast('Message deleted.')});
function stLog(rows){return`<table class="tbl"><tr><th>When</th><th>Staff</th><th>Action</th><th>Target</th><th>Detail</th></tr>${rows.map(r=>`<tr><td>${fmtTime(+new Date(r.created_at))}</td><td>${esc(uname(r.actor_id))}</td><td>${esc(r.action)}</td><td class="sub">${esc((r.target||'').slice(0,8))}</td><td>${esc(r.detail||'')}</td></tr>`).join('')||'<tr><td colspan=5 class="sub">Nothing logged yet.</td></tr>'}</table>`}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.fn==='stq'){V.staff.q=t.value;persist('stq',()=>{V.staff.d.users=null;renderSet()},400)}});

A.stGrant=el=>{const id=el.dataset.a;modal({title:'Grant plan & boosts',sub:'Only the platform owner can do this. Logged in the staff log.',body:`<label class="lbl">Plan</label><select class="input" id="gt">${[0,1,2,3].map(i=>`<option value="${i}" ${+el.dataset.b===i?'selected':''}>${i?PLANS[i].name:'No plan'}</option>`).join('')}</select><label class="lbl">Extra boosts to add (negative removes)</label><input class="input" id="gb" type="number" value="0" min="-1000" max="1000">`,btns:[{label:'Cancel',cls:'ghost'},{label:'Grant',cls:'primary',fn:()=>{tryDo(async()=>{await rpc('staff_grant_plan',{target:id,t:+$('#gt').value,extra_boosts:parseInt($('#gb').value)||0});V.staff.d.users=null;V.staff.d.log=null;renderSet()},'Plan updated.')}}]})};
A.stDemo=()=>tryDo(async()=>{const f=!demoOn();await rpc('staff_set_demo',{flag:f});S.cfg=S.cfg||{};S.cfg.demo_purchases=f;V.staff.d.log=null;renderSet()},'Updated.');
</script></body></html>
